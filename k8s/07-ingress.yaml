apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  namespace: sandipto-portfolio
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sandipto.in
        - www.sandipto.in
      secretName: sandipto-tls-secret
    - hosts:
        - portfolio.arnabpachal.site
      secretName: arnab-tls-secret
  rules:
    - host: sandipto.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
    - host: www.sandipto.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
    - host: portfolio.arnabpachal.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arnab-resume-service
                port:
                  number: 5173
