apiVersion: v1
kind: Secret
metadata:
  name: portfolio-secrets
  namespace: sandipto-portfolio
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "portfolio_user"
  MONGO_INITDB_ROOT_PASSWORD: "portfolio_pass"
  MONGO_INITDB_DATABASE: "portfolio"
  MONGODB_URI: "mongodb://portfolio_user:portfolio_pass@mongodb-service:27017/portfolio?authSource=admin"
  ADMIN_EMAIL: "admin@portfolio.com"
  ADMIN_PASSWORD: "admin123"
  NEXTAUTH_SECRET: "your-secret-key-change-this-in-production"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "your-email@gmail.com"
  SMTP_PASS: "your-gmail-app-password"
  MAIL_FROM: "Sandipto Journal <no-reply@sandiptojournal.com>"
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: "your-turnstile-site-key"
  TURNSTILE_SECRET_KEY: "your-turnstile-secret-key"
  OPENAI_API_KEY: "your-openai-api-key"
