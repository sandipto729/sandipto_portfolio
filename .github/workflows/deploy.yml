name: Deploy to Kubernetes Cluster

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push AI Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai_backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/portfolio-ai-backend:latest
            ghcr.io/${{ github.repository_owner }}/portfolio-ai-backend:${{ github.sha }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./portfolio
          push: true
          build-args: |
            MONGODB_URI=mongodb://portfolio_user:portfolio_pass@mongodb-service:27017/portfolio?authSource=admin
            AI_BACKEND_URL=http://ai-backend-service:8000
            NEXTAUTH_SECRET=your-secret-key-change-this-in-production
            NEXTAUTH_URL=http://sandipto.in
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAADHu-jf3fUSYI1za
          tags: |
            ghcr.io/${{ github.repository_owner }}/portfolio-frontend:latest
            ghcr.io/${{ github.repository_owner }}/portfolio-frontend:${{ github.sha }}

      - name: Deploy to Kubernetes via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          port: 7576
          username: deploy
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            echo "Connected to target host..."
            cd /home/deploy/sandipto_portfolio

            echo "Pulling latest code repository..."
            git fetch origin main
            git reset --hard origin/main

            echo "Applying Kubernetes manifests..."
            kubectl apply -f k8s/

            echo "Rolling out latest image deployments..."
            kubectl set image deployment/ai-backend ai-backend=ghcr.io/${{ github.repository_owner }}/portfolio-ai-backend:${{ github.sha }} -n sandipto_portfolio
            kubectl set image deployment/frontend frontend=ghcr.io/${{ github.repository_owner }}/portfolio-frontend:${{ github.sha }} -n sandipto_portfolio

            echo "Waiting for rollout completion..."
            kubectl rollout status deployment/ai-backend -n sandipto_portfolio --timeout=120s
            kubectl rollout status deployment/frontend -n sandipto_portfolio --timeout=120s

            echo "Deployment completed successfully!"
            kubectl get pods -n sandipto_portfolio
